[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spd-analyzer"
version = "1.0.0"
description = "Ferramenta profissional para análise de SPD (Serial Presence Detect) de módulos de memória"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SPD Analyzer Team"}
]
keywords = ["spd", "memory", "ddr3", "ddr4", "jedec", "smbus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Hardware Engineers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = [
    "rich>=13.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
smbus = ["smbus2>=0.4.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
include = ["spd_analyzer*"]

[project.urls]
Homepage = "https://github.com/anomalyco/spd-analyzer"

[project.scripts]
spd-analyzer = "spd_analyzer.cli:main"
